---
name: CI
on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: write
  id-token: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request'
      || github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Get version from tag
        id: get-version
        run: |
          VERSION="$(git describe --tags --match "v*.*.*")"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Set up dotnet CLI
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: ./*/packages.lock.json
      - name: Fetch dependencies
        run: |
          dotnet restore Generators --locked-mode
          dotnet restore Tests \
            --locked-mode --no-dependencies --use-current-runtime
      - name: Build project
        run: |
          dotnet build Generators \
            --no-restore --configuration Release \
            --property:Version="${{ steps.get-version.outputs.version }}"
      - name: Build tests
        run: |
          dotnet build Tests \
            --no-restore --no-dependencies --configuration Release
      - name: Run tests
        run: dotnet test Tests --no-build --configuration Release
      - name: Build package
        run: |
          dotnet pack Generators \
          --no-build --configuration Release \
          --property:PackageVersion="${{ steps.get-version.outputs.version }}" \
          --output "./dist/share/nuget/source/\
            Diabase.StrongTypes.Generators/\
            ${{ steps.get-version.outputs.version }}"
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: ./dist
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: .
          merge-multiple: true
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: rtechnics
      - name: Publish to Nuget registry
        run: |
          dotnet nuget push ./share/nuget/source/**/*.nupkg \
          --skip-duplicate --source https://api.nuget.org/v3/index.json \
          --api-key "${{steps.nuget-login.outputs.NUGET_API_KEY}}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: ./share/nuget/source/**/*.nupkg
